<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="user2.css">
</head>

<body>
    <section>
        <div class="row">
            <div class="col-12">
                <div class="btn btn-primary newUser" data-bs-toggle="modal" data-bs-target="#userapn">New User <i
                        class="bi bi-people-fill"></i></div>
            </div>
        </div>
        <div class="row">

            <div class="col-12">
                <table class="table table-hover table-striped text-center mt-3 table-bordered">
                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>Picture</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Email Id</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="data"></tbody>
                </table>
            </div>
        </div>
    </section>
    <div class="modal fade" id="userapn">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">Fill the Form</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form action="#" id="myform">
                        <div class="card imgholder">
                            <Label class="upload">
                                <input type="file" id="imginput" onchange="getfile(this);">
                                <i class="bi bi-plus-circle"></i>
                            </Label>
                            <img src="images/desert.jpg" id="imgdisp" class="img-fluid" alt="">
                        </div>
                        <div class="inputfield">
                            <div>
                                <label for="name">Name: </label>
                                <input type="text" id="name">
                            </div>
                            <div>
                                <label for="age">Age: </label>
                                <input type="text" id="age">
                            </div>
                            <div>
                                <label for="city">City: </label>
                                <input type="text" id="city">
                            </div>
                            <div>
                                <label for="phone">Phone: </label>
                                <input type="text" id="phone">
                            </div>
                            <div>
                                <label for="email">Email: </label>
                                <input type="text" id="email">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="submit" form="myform" class="btn btn-success submit w-50">Save</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="readapn">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">Profile</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form action="#">
                        <div class="card imgholder">
                            <img src="images/desert.jpg" class="img-fluid" id="showimg" alt="">
                        </div>
                        <div class="inputfield">
                            <div>
                                <label for="name">Name: </label>
                                <input type="text" id="showname" disabled>
                            </div>
                            <div>
                                <label for="age">Age: </label>
                                <input type="text" id="showage" disabled>
                            </div>
                            <div>
                                <label for="city">City: </label>
                                <input type="text" id="showcity" disabled>
                            </div>
                            <div>
                                <label for="phone">Phone: </label>
                                <input type="text" id="showphone" disabled>
                            </div>
                            <div>
                                <label for="email">Email: </label>
                                <input type="text" id="showemail" disabled>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="user2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
